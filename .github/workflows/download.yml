name: download

on:
  workflow_dispatch:
    inputs:
      url:
        description: "影片網址"
        required: true
      selector:
        description: "yt-dlp 格式選擇器"
        required: false
        default: "bv*+ba/b"
      audio:
        description: "true = 只取 MP3 音檔"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet -U yt-dlp

      # 選用：repo Settings → Secrets → Actions 加一個 COOKIES
      # 內容可以是 Netscape cookies.txt 原文，或它的 base64。沒設定就跳過。
      - name: Prepare cookies (optional)
        env:
          COOKIES: ${{ secrets.COOKIES }}
        run: |
          set -e
          if [ -z "${COOKIES:-}" ]; then
            echo "no COOKIES secret, continuing without cookies"
            exit 0
          fi
          printf '%s' "$COOKIES" > /tmp/ck.raw
          if [ "$(head -c 1 /tmp/ck.raw)" = "#" ]; then
            cp /tmp/ck.raw cookies.txt
          else
            base64 -d /tmp/ck.raw > cookies.txt 2>/dev/null || cp /tmp/ck.raw cookies.txt
          fi
          echo "COOKIES_FILE=$PWD/cookies.txt" >> "$GITHUB_ENV"
          echo "cookies lines: $(wc -l < cookies.txt)"

      - name: Download
        env:
          URL: ${{ inputs.url }}
          SELECTOR: ${{ inputs.selector }}
          AUDIO: ${{ inputs.audio }}
        run: |
          set -e
          mkdir -p out
          python3 - <<'PY'
          import os, sys, yt_dlp

          url = (os.environ.get("URL") or "").strip()
          sel = os.environ.get("SELECTOR") or "bv*+ba/b"
          audio = (os.environ.get("AUDIO", "false") or "").lower() == "true"
          ck = os.environ.get("COOKIES_FILE")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")

          opts = {
              "format": sel if not audio else "bestaudio/best",
              "outtmpl": "out/%(title).80s.%(ext)s",
              "noplaylist": True,
              "quiet": True,
              "no_warnings": False,
              "retries": 5,
              "fragment_retries": 5,
              "concurrent_fragment_downloads": 4,
          }
          if ck and os.path.exists(ck):
              opts["cookiefile"] = ck
          if audio:
              opts["postprocessors"] = [{
                  "key": "FFmpegExtractAudio",
                  "preferredcodec": "mp3",
                  "preferredquality": "320",
              }]
          else:
              opts["merge_output_format"] = "mp4"

          def report(title, body):
              if not summary:
                  return
              with open(summary, "a", encoding="utf-8") as f:
                  f.write(f"## {title}\n\n```\n{body}\n```\n\n"
                          f"URL：`{url}`\n格式：`{opts['format']}`　音檔：`{audio}`　"
                          f"cookies：`{'有' if opts.get('cookiefile') else '沒有'}`\n")

          try:
              with yt_dlp.YoutubeDL(opts) as ydl:
                  ydl.download([url])
          except Exception as e:
              msg = str(e).strip() or e.__class__.__name__
              msg = "\n".join(msg.splitlines()[:25])[:3000]
              report("❌ 下載失敗（yt-dlp 原始錯誤）", msg)
              # 同時變成 run 頁面的紅色 annotation，手機上也看得到
              one_line = " ".join(msg.split())[:900]
              for a, b in (("%", "%25"), ("\r", "%0D"), ("\n", "%0A")):
                  one_line = one_line.replace(a, b)
              print(f"::error title=yt-dlp 失敗::{one_line}")
              sys.exit(1)

          files = [f for f in os.listdir("out")] if os.path.isdir("out") else []
          if not files:
              report("❌ 下載完成但沒有檔案", "out/ 是空的，通常是格式選擇器沒有可用格式。")
              print("::error title=沒有輸出檔案::out/ 是空的，檢查 selector")
              sys.exit(1)
          print("produced:", files)
          PY
          ls -lh out/

      # 1) Release asset -> a direct .mp4 link (no zip)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          set -e
          FILE=$(ls -S out/* | head -1)
          NAME=$(basename "$FILE")
          SIZE=$(du -m "$FILE" | cut -f1)
          if [ "$SIZE" -gt 1900 ]; then
            echo "::error title=檔案過大::${NAME} 是 ${SIZE}MB，Release 資產上限 2GB，請改用較低畫質選擇器"
            exit 1
          fi
          TAG="dl-${RUN}-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "$FILE" -R "$REPO" \
            --title "下載 ${RUN}" \
            --notes "由 GitHub Actions 自動產生，可隨時刪除。" \
            --latest=false

          URL=$(REPO="$REPO" TAG="$TAG" NAME="$NAME" python3 - <<'PY'
          import os, urllib.parse
          repo, tag, name = os.environ["REPO"], os.environ["TAG"], os.environ["NAME"]
          print(f"https://github.com/{repo}/releases/download/{tag}/{urllib.parse.quote(name)}")
          PY
          )
          {
            echo "## ✅ 下載完成"
            echo ""
            echo "**[${NAME}](${URL})**"
            echo ""
            echo "點上面連結即可直接存成 ${NAME}（不是 zip）。"
            echo ""
            echo "檔案大小：$(du -h "$FILE" | cut -f1)　·　Release tag：\`${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "DIRECT_URL=${URL}" >> "$GITHUB_ENV"

      # 2) Artifact kept for the web page's "GitHub Actions mode"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/*
          retention-days: 1
          if-no-files-found: error
