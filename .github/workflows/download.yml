name: download

on:
  workflow_dispatch:
    inputs:
      url:
        description: "影片網址"
        required: true
      selector:
        description: "yt-dlp 格式選擇器"
        required: false
        default: "bv*+ba/b"
      audio:
        description: "true = 只取 MP3 音檔"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet -U yt-dlp

      - name: Download
        env:
          URL: ${{ inputs.url }}
          SELECTOR: ${{ inputs.selector }}
          AUDIO: ${{ inputs.audio }}
        run: |
          set -e
          mkdir -p out
          python3 - <<'PY'
          import os, yt_dlp
          url = os.environ["URL"]
          sel = os.environ.get("SELECTOR") or "bv*+ba/b"
          audio = os.environ.get("AUDIO", "false").lower() == "true"
          opts = {
              "format": sel if not audio else "bestaudio/best",
              "outtmpl": "out/%(title).80s.%(ext)s",
              "noplaylist": True,
              "quiet": True,
              "no_warnings": True,
              "retries": 5,
              "fragment_retries": 5,
              "concurrent_fragment_downloads": 4,
          }
          if audio:
              opts["postprocessors"] = [{
                  "key": "FFmpegExtractAudio",
                  "preferredcodec": "mp3",
                  "preferredquality": "320",
              }]
          else:
              opts["merge_output_format"] = "mp4"
          with yt_dlp.YoutubeDL(opts) as ydl:
              ydl.download([url])
          PY
          ls -lh out/

      # 1) Release asset -> a direct .mp4 link (no zip)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          set -e
          FILE=$(ls -S out/* | head -1)
          NAME=$(basename "$FILE")
          TAG="dl-${RUN}-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "$FILE" -R "$REPO" \
            --title "下載 ${RUN}" \
            --notes "由 GitHub Actions 自動產生，可隨時刪除。" \
            --latest=false

          URL=$(REPO="$REPO" TAG="$TAG" NAME="$NAME" python3 - <<'PY'
          import os, urllib.parse
          repo, tag, name = os.environ["REPO"], os.environ["TAG"], os.environ["NAME"]
          print(f"https://github.com/{repo}/releases/download/{tag}/{urllib.parse.quote(name)}")
          PY
          )
          {
            echo "## ✅ 下載完成"
            echo ""
            echo "**[${NAME}](${URL})**"
            echo ""
            echo "點上面連結即可直接存成 ${NAME}（不是 zip）。"
            echo ""
            echo "檔案大小：$(du -h "$FILE" | cut -f1)　·　Release tag：\`${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "DIRECT_URL=${URL}" >> "$GITHUB_ENV"

      # 2) Artifact kept for the web page's "GitHub Actions mode"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/*
          retention-days: 1
          if-no-files-found: error
