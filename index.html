<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>影片下載器 · Video Downloader</title>
<meta name="description" content="貼上連結即可下載 YouTube、Instagram、Facebook 等網站的影片或音檔。">
<style>
  :root{
    --bg:#0b0d12;
    --bg2:#11141c;
    --card:#161a24;
    --card2:#1c2130;
    --line:rgba(255,255,255,.09);
    --tx:#eef1f7;
    --tx2:#9aa4b8;
    --tx3:#6b7488;
    --acc:#ff4d67;
    --acc2:#ff8a3d;
    --ok:#2ecc8f;
    --warn:#ffc247;
    --err:#ff5c72;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 500px at 12% -8%, rgba(255,77,103,.16), transparent 62%),
      radial-gradient(800px 480px at 92% 4%, rgba(255,138,61,.13), transparent 60%),
      var(--bg);
    color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","PingFang TC","Noto Sans HK","Microsoft JhengHei","Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    line-height:1.55;
    padding:22px 16px 64px;
    display:flex;justify-content:center;
  }
  .wrap{width:100%;max-width:720px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .logo{
    width:42px;height:42px;border-radius:13px;flex:0 0 auto;
    background:linear-gradient(140deg,var(--acc),var(--acc2));
    display:grid;place-items:center;box-shadow:0 8px 24px rgba(255,77,103,.28);
  }
  .logo svg{width:22px;height:22px}
  h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}
  header p{margin:1px 0 0;font-size:12.5px;color:var(--tx2)}
  .spacer{flex:1}
  .icon-btn{
    width:38px;height:38px;border-radius:12px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--tx2);display:grid;place-items:center;cursor:pointer;
    transition:.18s;
  }
  .icon-btn:hover{color:var(--tx);background:rgba(255,255,255,.08)}

  .card{
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    border:1px solid var(--line);border-radius:var(--r);
    padding:16px;
    box-shadow:0 18px 40px -24px rgba(0,0,0,.9);
    backdrop-filter:blur(8px);
  }
  .field{display:flex;gap:8px;align-items:center;background:var(--bg2);border:1px solid var(--line);
    border-radius:14px;padding:6px 6px 6px 14px;transition:.18s}
  .field:focus-within{border-color:rgba(255,77,103,.55);box-shadow:0 0 0 3px rgba(255,77,103,.12)}
  .field input{
    flex:1;min-width:0;background:none;border:0;outline:none;color:var(--tx);
    font-size:15px;padding:11px 0;font-family:inherit;
  }
  .field input::placeholder{color:var(--tx3)}
  .mini{
    border:0;border-radius:10px;background:rgba(255,255,255,.07);color:var(--tx2);
    font-size:12.5px;padding:8px 10px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s;
  }
  .mini:hover{background:rgba(255,255,255,.13);color:var(--tx)}
  .go{
    border:0;border-radius:11px;padding:11px 18px;font-size:14px;font-weight:650;font-family:inherit;
    background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;cursor:pointer;
    transition:.18s;white-space:nowrap;
  }
  .go:hover{filter:brightness(1.07)}
  .go:disabled{opacity:.55;cursor:default;filter:none}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
  .chip{
    font-size:11.5px;color:var(--tx2);border:1px solid var(--line);background:rgba(255,255,255,.03);
    border-radius:999px;padding:4px 10px;display:flex;align-items:center;gap:5px;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
  .chip.yt{color:#ff6b6b}.chip.ig{color:#e17bc4}.chip.fb{color:#6da8ff}
  .chip.tk{color:#7fe3e0}.chip.x{color:#c9d1e0}

  .banner{
    margin-top:14px;border:1px solid rgba(255,194,71,.35);background:rgba(255,194,71,.08);
    color:#ffd98a;border-radius:13px;padding:12px 14px;font-size:13px;display:none;
  }
  .banner b{color:#ffe6ae}
  .banner a{color:#ffd98a}

  .result{margin-top:16px;display:none}
  .meta{display:flex;gap:13px}
  .thumb{
    width:132px;height:76px;border-radius:11px;object-fit:cover;flex:0 0 auto;
    background:var(--card2);border:1px solid var(--line);
  }
  .meta-txt{min-width:0;flex:1}
  .meta-txt h3{margin:0 0 4px;font-size:14.5px;font-weight:650;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .sub{font-size:12px;color:var(--tx3);display:flex;gap:9px;flex-wrap:wrap}
  .sub span{display:flex;align-items:center;gap:4px}

  .opts{display:grid;grid-template-columns:1fr;gap:7px;margin-top:14px}
  .opt{
    display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;cursor:pointer;background:rgba(255,255,255,.02);transition:.15s;
  }
  .opt:hover{background:rgba(255,255,255,.06)}
  .opt.sel{border-color:rgba(255,77,103,.6);background:rgba(255,77,103,.1)}
  .opt .radio{width:15px;height:15px;border-radius:50%;border:2px solid var(--tx3);flex:0 0 auto;position:relative}
  .opt.sel .radio{border-color:var(--acc)}
  .opt.sel .radio::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--acc)}
  .opt .lbl{font-size:13.5px;font-weight:600}
  .opt .note{margin-left:auto;font-size:11.5px;color:var(--tx3);white-space:nowrap}

  .dl{width:100%;margin-top:13px;padding:13px;border-radius:13px;border:0;font-family:inherit;
    font-size:14.5px;font-weight:700;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,var(--acc),var(--acc2));transition:.18s}
  .dl:hover{filter:brightness(1.07)}
  .dl:disabled{opacity:.5;cursor:default}

  .prog{margin-top:13px;display:none}
  .bar{height:7px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .35s ease}
  .prog-line{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2);margin-top:7px}

  .msg{margin-top:13px;font-size:13px;border-radius:12px;padding:11px 13px;display:none}
  .msg.err{display:block;background:rgba(255,92,114,.1);border:1px solid rgba(255,92,114,.35);color:#ffb3be}
  .msg.ok{display:block;background:rgba(46,204,143,.1);border:1px solid rgba(46,204,143,.35);color:#8ff0c6}

  .sec-title{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);
    margin:26px 0 9px;font-weight:650}
  .hist{display:flex;flex-direction:column;gap:7px}
  .h-item{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--tx2);
    border:1px solid var(--line);border-radius:11px;padding:9px 12px;background:rgba(255,255,255,.02)}
  .h-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx)}
  .h-item .tm{color:var(--tx3);font-size:11px;white-space:nowrap}
  .empty{font-size:12.5px;color:var(--tx3)}

  .sheet{position:fixed;inset:0;background:rgba(5,6,9,.72);backdrop-filter:blur(6px);
    display:none;align-items:flex-end;justify-content:center;z-index:50;padding:0}
  .sheet.on{display:flex}
  .sheet-in{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;
    width:100%;max-width:720px;padding:20px 18px 26px}
  .sheet-in h2{margin:0 0 4px;font-size:16px}
  .sheet-in p{margin:0 0 14px;font-size:12.5px;color:var(--tx2)}
  .sheet-in input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;
    padding:12px 13px;color:var(--tx);font-size:14px;outline:none;font-family:inherit}
  .sheet-in input:focus{border-color:rgba(255,77,103,.55)}
  .row{display:flex;gap:9px;margin-top:14px}
  .row button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);
    color:var(--tx);font-size:14px;font-family:inherit;cursor:pointer;font-weight:600}
  .row button.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#fff}
  footer{margin-top:34px;text-align:center;font-size:11.5px;color:var(--tx3);line-height:1.7}
  footer a{color:var(--tx3)}
  @media(min-width:560px){
    .opts{grid-template-columns:1fr 1fr}
    .thumb{width:168px;height:96px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v11"/><path d="m7.5 10 4.5 4.5L16.5 10"/><path d="M4 20h16"/>
      </svg>
    </div>
    <div>
      <h1>影片下載器</h1>
      <p>貼上連結即可下載影片或音檔</p>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="settingsBtn" title="伺服器設定" aria-label="伺服器設定">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.11a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.11a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.11a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.11a1.7 1.7 0 0 0-1.49 1z"/>
      </svg>
    </button>
  </header>

  <div class="card">
    <div class="field">
      <input id="url" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false"
             placeholder="貼上 YouTube / Instagram / Facebook 連結…">
      <button class="mini" id="pasteBtn">貼上</button>
      <button class="go" id="fetchBtn">解析</button>
    </div>

    <div class="chips">
      <span class="chip yt"><i class="dot"></i>YouTube</span>
      <span class="chip ig"><i class="dot"></i>Instagram</span>
      <span class="chip fb"><i class="dot"></i>Facebook</span>
      <span class="chip tk"><i class="dot"></i>TikTok</span>
      <span class="chip x"><i class="dot"></i>X / 其他</span>
    </div>

    <div class="banner" id="banner"></div>

    <div class="result" id="result">
      <div class="meta">
        <img class="thumb" id="thumb" alt="">
        <div class="meta-txt">
          <h3 id="title">—</h3>
          <div class="sub" id="sub"></div>
        </div>
      </div>
      <div class="opts" id="opts"></div>
      <button class="dl" id="dlBtn">下載</button>
    </div>

    <div class="prog" id="prog">
      <div class="bar"><i id="barFill"></i></div>
      <div class="prog-line"><span id="pct">0%</span><span id="speed"></span></div>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <div class="sec-title">最近</div>
  <div class="hist" id="hist"><div class="empty">還沒有下載記錄。</div></div>

  <footer>
    只下載你有權使用的內容 · 私人或需登入的內容需在伺服器設定 cookies<br>
    Powered by yt-dlp
  </footer>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-in">
    <h2>伺服器設定</h2>
    <p>這個網頁需要一個後端伺服器（yt-dlp）才能真正下載影片。填入伺服器網址，例如 <code>https://your-app.onrender.com</code> 或 <code>http://localhost:8000</code>。</p>
    <input id="apiInput" placeholder="https://…" autocapitalize="off" spellcheck="false">
    <div class="row">
      <button id="testBtn">測試連線</button>
      <button class="pri" id="saveBtn">儲存</button>
    </div>
    <div class="msg" id="sheetMsg"></div>
  </div>
</div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const isGH = /\.github\.io$/.test(location.hostname);
  const store = {
    get api(){ return localStorage.getItem('vd_api') || ''; },
    set api(v){ v ? localStorage.setItem('vd_api', v) : localStorage.removeItem('vd_api'); },
    get hist(){ try { return JSON.parse(localStorage.getItem('vd_hist') || '[]'); } catch(e){ return []; } },
    set hist(v){ localStorage.setItem('vd_hist', JSON.stringify(v.slice(0,8))); }
  };

  let API = (store.api || (isGH ? '' : location.origin)).replace(/\/+$/, '');
  let current = null;      // info payload
  let currentUrl = '';
  let selected = null;
  let polling = null;

  function setMsg(text, kind){
    const m = $('#msg');
    m.className = 'msg' + (kind ? ' ' + kind : '');
    m.textContent = text || '';
  }

  function showBanner(html){
    const b = $('#banner');
    if(!html){ b.style.display = 'none'; return; }
    b.innerHTML = html; b.style.display = 'block';
  }

  function needServer(){
    if(API) return false;
    showBanner('<b>尚未設定伺服器。</b> GitHub Pages 只能寄存靜態網頁，影片下載需要一個 yt-dlp 後端。<br>按右上角齒輪填入伺服器網址，或看 <a href="./README.html">部署說明</a>。');
    openSheet();
    return true;
  }

  function openSheet(){
    $('#apiInput').value = API || '';
    $('#sheet').classList.add('on');
  }
  $('#settingsBtn').onclick = openSheet;
  $('#sheet').onclick = e => { if(e.target.id === 'sheet') $('#sheet').classList.remove('on'); };

  $('#testBtn').onclick = async () => {
    const v = $('#apiInput').value.trim().replace(/\/+$/, '');
    const box = $('#sheetMsg');
    box.className = 'msg'; box.textContent = '';
    if(!v){ box.className = 'msg err'; box.textContent = '請先填入網址'; return; }
    box.className = 'msg ok'; box.textContent = '連線中…';
    try{
      const r = await fetch(v + '/api/health', {cache:'no-store'});
      const j = await r.json();
      box.className = 'msg ok';
      box.textContent = `連線成功 · yt-dlp ${j.yt_dlp}` + (j.ffmpeg ? ' · ffmpeg 已就緒' : ' · 無 ffmpeg（只能單檔畫質）');
    }catch(e){
      box.className = 'msg err'; box.textContent = '連線失敗：' + e.message;
    }
  };

  $('#saveBtn').onclick = () => {
    API = $('#apiInput').value.trim().replace(/\/+$/, '');
    store.api = API;
    $('#sheet').classList.remove('on');
    if(API) showBanner('');
  };

  $('#pasteBtn').onclick = async () => {
    try{
      const t = await navigator.clipboard.readText();
      if(t){ $('#url').value = t.trim(); $('#url').focus(); }
    }catch(e){
      $('#url').focus();
      setMsg('瀏覽器不允許自動讀取剪貼簿，請長按輸入框貼上。', 'err');
    }
  };

  function hostOf(u){
    try{ return new URL(u).hostname.replace(/^www\./, ''); }catch(e){ return ''; }
  }

  async function fetchInfo(){
    const url = $('#url').value.trim();
    if(!url){ setMsg('請先貼上連結', 'err'); return; }
    if(needServer()) return;
    setMsg(''); $('#result').style.display = 'none'; $('#prog').style.display = 'none';
    const btn = $('#fetchBtn');
    btn.disabled = true; btn.textContent = '解析中';
    try{
      const r = await fetch(API + '/api/info', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({url})
      });
      const j = await r.json();
      if(!r.ok || !j.ok) throw new Error(j.error || '解析失敗');
      current = j.data; currentUrl = url;
      render(j.data);
    }catch(e){
      setMsg(e.message || '解析失敗', 'err');
    }finally{
      btn.disabled = false; btn.textContent = '解析';
    }
  }

  function render(d){
    $('#thumb').src = d.thumbnail || '';
    $('#thumb').style.display = d.thumbnail ? '' : 'none';
    $('#title').textContent = d.title || '未命名';
    const bits = [];
    if(d.uploader) bits.push(d.uploader);
    if(d.duration) bits.push(d.duration);
    if(d.extractor) bits.push(d.extractor);
    $('#sub').innerHTML = bits.map(b => `<span>${escapeHtml(b)}</span>`).join('');

    const opts = $('#opts');
    opts.innerHTML = '';
    if(!d.options || !d.options.length){
      const el = document.createElement('div');
      el.className = 'opt sel';
      el.innerHTML = '<span class="radio"></span><span class="lbl">原始檔案（' + escapeHtml(d.ext || 'file') + '）</span>';
      selected = {selector:'best', label:'original', kind:'video'};
      opts.appendChild(el);
    } else {
      selected = d.options[0];
      d.options.forEach((o, i) => {
        const el = document.createElement('div');
        el.className = 'opt' + (i === 0 ? ' sel' : '');
        el.innerHTML = '<span class="radio"></span><span class="lbl">' + escapeHtml(o.label) + '</span>' +
                       (o.note ? '<span class="note">' + escapeHtml(o.note) + '</span>' : '');
        el.onclick = () => {
          [...opts.children].forEach(c => c.classList.remove('sel'));
          el.classList.add('sel');
          selected = o;
        };
        opts.appendChild(el);
      });
    }
    $('#result').style.display = 'block';
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function download(){
    if(!current || !selected) return;
    if(needServer()) return;
    const btn = $('#dlBtn');
    btn.disabled = true; btn.textContent = '準備中…';
    setMsg('');
    $('#prog').style.display = 'block';
    $('#barFill').style.width = '2%';
    $('#pct').textContent = '0%';
    $('#speed').textContent = '';

    try{
      const r = await fetch(API + '/api/download', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({url: currentUrl, selector: selected.selector, audio_only: selected.kind === 'audio'})
      });
      const j = await r.json();
      if(!j.ok) throw new Error(j.error || '無法開始下載');
      poll(j.job_id);
    }catch(e){
      setMsg(e.message, 'err');
      btn.disabled = false; btn.textContent = '下載';
      $('#prog').style.display = 'none';
    }
  }

  function poll(id){
    clearInterval(polling);
    polling = setInterval(async () => {
      try{
        const r = await fetch(`${API}/api/progress/${id}`, {cache:'no-store'});
        const j = await r.json();
        if(!j.ok) throw new Error(j.error || '任務失效');
        $('#barFill').style.width = Math.max(2, j.percent) + '%';
        $('#pct').textContent = Math.round(j.percent) + '%';
        $('#speed').textContent = [j.speed, j.eta ? '剩 ' + j.eta : ''].filter(Boolean).join(' · ');

        if(j.status === 'done'){
          clearInterval(polling);
          $('#barFill').style.width = '100%';
          $('#pct').textContent = '100%';
          $('#speed').textContent = '';
          const a = document.createElement('a');
          a.href = `${API}/api/file/${id}`;
          a.download = j.filename || '';
          document.body.appendChild(a); a.click(); a.remove();
          setMsg('已開始下載：' + (j.filename || ''), 'ok');
          addHist(current ? current.title : currentUrl, j.filename);
          const btn = $('#dlBtn'); btn.disabled = false; btn.textContent = '下載';
        }
        if(j.status === 'error'){
          clearInterval(polling);
          setMsg(j.error || '下載失敗', 'err');
          const btn = $('#dlBtn'); btn.disabled = false; btn.textContent = '下載';
          $('#prog').style.display = 'none';
        }
      }catch(e){
        clearInterval(polling);
        setMsg(e.message, 'err');
        const btn = $('#dlBtn'); btn.disabled = false; btn.textContent = '下載';
      }
    }, 900);
  }

  function addHist(title, file){
    const h = store.hist;
    h.unshift({t: title || '', f: file || '', at: Date.now()});
    store.hist = h;
    renderHist();
  }

  function renderHist(){
    const h = store.hist;
    const box = $('#hist');
    if(!h.length){ box.innerHTML = '<div class="empty">還沒有下載記錄。</div>'; return; }
    box.innerHTML = h.map(x => {
      const d = new Date(x.at);
      const tm = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      return `<div class="h-item"><span class="nm">${escapeHtml(x.f || x.t)}</span><span class="tm">${tm}</span></div>`;
    }).join('');
  }

  $('#fetchBtn').onclick = fetchInfo;
  $('#dlBtn').onclick = download;
  $('#url').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); fetchInfo(); } });

  if(!API && isGH){
    showBanner('<b>尚未設定伺服器。</b> GitHub Pages 只能寄存靜態網頁，影片下載需要一個 yt-dlp 後端。<br>按右上角齒輪填入伺服器網址，或看 <a href="./README.html">部署說明</a>。');
  }
  renderHist();
})();
</script>
</body>
</html>
